<!--
  Список изменений: верхняя строка новая и потому янтарная, ниже — то, что было.
  Зелёный значок со стрелкой — версия поехала вверх.
-->
<svg viewBox="0 0 168 124" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="22" y="20" width="124" height="84" rx="12"
        fill="var(--color-surface, #ffffff)" stroke="var(--color-line, #d4d4d8)" stroke-width="1.5" />
  <rect x="38" y="38" width="52" height="7" rx="3.5" fill="var(--color-mark-new, #eebd4a)" />
  <rect x="96" y="38" width="28" height="7" rx="3.5" fill="currentColor" opacity=".18" />
  <rect x="38" y="56" width="86" height="6" rx="3" fill="currentColor" opacity=".18" />
  <rect x="38" y="72" width="62" height="6" rx="3" fill="currentColor" opacity=".18" />

  <!-- значок янтарный, а не зелёный: обновление — это «новое», а зелёный в наборе
       значит «уже знакомо», и здесь он не про что -->
  <circle cx="134" cy="94" r="14" fill="var(--color-mark-new, #eebd4a)" />
  <path d="M134 100v-12m-5.5 5.5l5.5-5.5 5.5 5.5" stroke="var(--color-surface, #ffffff)"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
