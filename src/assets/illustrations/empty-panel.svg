<!--
  Страница текста, где горят два слова: янтарное новое и зелёное сохранённое.
  Ровно то, что расширение делает с текстом, — и ровно те же два цвета.
  Цвета берутся токенами темы; запасные значения оставлены, чтобы файл был
  осмысленным и сам по себе (в shadow DOM оверлея токенов страницы нет).
-->
<svg viewBox="0 0 168 124" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <rect x="44" y="8" width="102" height="88" rx="12" transform="rotate(6 95 52)"
        fill="var(--color-surface-hover, #f4f4f5)" stroke="var(--color-line, #d4d4d8)" stroke-width="1.5" />
  <g transform="rotate(-4 76 64)">
    <rect x="22" y="20" width="102" height="88" rx="12"
          fill="var(--color-surface, #ffffff)" stroke="var(--color-line, #d4d4d8)" stroke-width="1.5" />
    <rect x="36" y="38" width="60" height="7" rx="3.5" fill="currentColor" opacity=".2" />
    <rect x="36" y="53" width="74" height="7" rx="3.5" fill="currentColor" opacity=".2" />
    <rect x="36" y="68" width="26" height="7" rx="3.5" fill="var(--color-mark-new, #eebd4a)" />
    <rect x="68" y="68" width="42" height="7" rx="3.5" fill="currentColor" opacity=".2" />
    <rect x="36" y="83" width="32" height="7" rx="3.5" fill="var(--color-mark-saved, #7fb894)" />
    <rect x="74" y="83" width="22" height="7" rx="3.5" fill="currentColor" opacity=".2" />
  </g>
</svg>
