<!--
  Лестница повторений: слово идёт от янтарного «нового» к зелёному «освоенному»,
  и чем дальше, тем реже узлы — тот самый растущий интервал 1, 3, 7, 16, 35, 90 дней.
  Над последним узлом карточка: доехать до неё и значит выучить. Цвета взяты токенами
  темы, поэтому картинка перекрашивается в тёмной.
-->
<svg viewBox="0 0 220 130" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="nt-track" x1="14" y1="112" x2="166" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--color-mark-new, #eebd4a)" />
      <stop offset=".5" stop-color="var(--color-learning, #5c8f9e)" />
      <stop offset="1" stop-color="var(--color-mark-saved, #7fb894)" />
    </linearGradient>
  </defs>

  <path d="M14 112C56 112 74 92 104 82c24-6 40-10 62-18" stroke="url(#nt-track)"
        stroke-width="3.5" stroke-linecap="round" />

  <!-- ореол у последнего узла: цель маршрута должна читаться без подписи -->
  <circle cx="166" cy="64" r="13" fill="var(--color-mark-saved, #7fb894)" opacity=".18" />

  <g stroke="var(--color-surface, #ffffff)" stroke-width="2.5">
    <circle cx="14" cy="112" r="3.5" fill="var(--color-mark-new, #eebd4a)" />
    <circle cx="59" cy="103" r="4" fill="var(--color-mark-new, #eebd4a)" />
    <circle cx="104" cy="82" r="4.5" fill="var(--color-learning, #5c8f9e)" />
    <circle cx="136" cy="74" r="5" fill="var(--color-learning, #5c8f9e)" />
    <circle cx="166" cy="64" r="6" fill="var(--color-mark-saved, #7fb894)" />
  </g>

  <!-- карточка со словом: тень имитируется вторым прямоугольником, фильтры в svg дороги -->
  <g transform="rotate(5 172 30)">
    <rect x="136" y="16" width="76" height="42" rx="10" fill="var(--color-surface-hover, #f4f4f5)"
          stroke="var(--color-line, #d4d4d8)" stroke-width="1.5" />
    <rect x="132" y="10" width="76" height="42" rx="10" fill="var(--color-surface, #ffffff)"
          stroke="var(--color-line, #d4d4d8)" stroke-width="1.5" />
    <rect x="144" y="22" width="38" height="6" rx="3" fill="currentColor" opacity=".3" />
    <rect x="144" y="36" width="52" height="5" rx="2.5" fill="currentColor" opacity=".14" />
  </g>

  <!-- искры у карточки: единственная декорация, зато экран перестаёт быть таблицей -->
  <g fill="var(--color-mark-saved, #7fb894)">
    <path d="M118 22l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8z" opacity=".5" />
    <path d="M107 44l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" opacity=".35" />
  </g>
</svg>
