<!--
  Ожидание словаря: слово подчёркивается слева направо и подчёркивание гаснет.
  Имена классов и кадров с префиксом `nt-ld-`: файл встраивается в разметку
  как есть, и его `<style>` действует на весь документ.
-->
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <style>
    .nt-ld-u-word rect { animation: nt-ld-u-dim 1.4s ease-in-out infinite; }
    .nt-ld-u-word rect:nth-of-type(2) { animation-delay: .12s; }
    .nt-ld-u-word rect:nth-of-type(3) { animation-delay: .24s; }
    .nt-ld-u-line {
      transform-box: fill-box;
      transform-origin: left center;
      animation: nt-ld-u-draw 1.4s ease-in-out infinite;
    }
    @keyframes nt-ld-u-dim { 0%, 100% { opacity: .26 } 40% { opacity: .7 } }
    @keyframes nt-ld-u-draw {
      0% { transform: scaleX(.05); opacity: 1 }
      55% { transform: scaleX(1); opacity: 1 }
      80%, 100% { transform: scaleX(1); opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      .nt-ld-u-word rect, .nt-ld-u-line { animation: none; opacity: .5 }
    }
  </style>
  <g class="nt-ld-u-word" fill="currentColor" opacity=".26">
    <rect x="3" y="7" width="8" height="3.5" rx="1.75" />
    <rect x="13" y="7" width="4.5" height="3.5" rx="1.75" />
    <rect x="19.5" y="7" width="3" height="3.5" rx="1.75" />
  </g>
  <rect class="nt-ld-u-line" x="3" y="14" width="18" height="2.5" rx="1.25"
        fill="var(--color-mark-new, #eebd4a)" />
</svg>
